# Alpindroid — Weston 14 profile (v0.19 development stage)
#
# Rendering path: DRM backend on the HDMI head (sun4i-drm, /dev/dri/card0)
# with the GL renderer on the Panfrost node (/dev/dri/renderD128).
# The display is a 1024x600 panel (EDID: PNP(LTM) LONTIUM), so `mode=preferred`
# lets the compositor pick it instead of forcing a mode the panel cannot lock.
#
# Touch input is generic: the panel exposes a USB HID multi-touch device
# (OpenWare Multi-Touch-V5000, 222a:0001) which the in-kernel hid-multitouch
# driver drives in MT-B mode with INPUT_PROP_DIRECT. libinput handles it and
# the udev rule (config/udev/99-alpindroid-touch.rules) binds it to HDMI-A-1.

[core]
backend=drm
renderer=gl
shell=desktop
# Development profile: never blank the screen. Restore a sane DPMS timeout
# for the released image.
idle-time=0

[output]
name=HDMI-A-1
mode=preferred

[libinput]
# Tap-to-click on the touch panel; no pointer device is required.
enable-tap=true

[shell]
# Keep the launcher panel at the bottom on the small panel.
panel-position=bottom
# Without a cursor theme Weston logs "could not load cursor 'left_ptr'" and the
# pointer stays invisible, which makes touch debugging impossible.
# Provided by the adwaita-icon-theme package (Alpine 3.23 has no
# separate adwaita-cursors package).
cursor-theme=Adwaita
cursor-size=32
